<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Pro Electrical — Digital Card</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#050505; --navy-900:#0c0c0c; --navy-800:#141414; --navy-border:#242424;
    --amber-500:#f5b400; --amber-400:#ffd23f;
    --ink:#f3f0e8; --ink-dim:#b8b3a4; --ink-mute:#85806f; --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--navy-950); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 18px;
  }

  .hazard{
    height:8px;
    background:repeating-linear-gradient(45deg, var(--amber-500), var(--amber-500) 12px, var(--navy-950) 12px, var(--navy-950) 24px);
  }

  .card{
    width:100%; max-width:420px;
    background:var(--navy-900);
    border:1px solid var(--navy-border);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%);
    position:relative;
  }

  .panel{ padding:40px 32px 34px; text-align:center; }

  .badge-ring{
    width:132px; height:132px; margin:0 auto 22px;
    border:2px solid var(--amber-500);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    box-shadow:0 0 0 6px rgba(245,180,0,.08);
  }
  .badge-ring img{ width:96px; height:96px; }
  .led{
    position:absolute; top:6px; right:10px;
    width:9px; height:9px; border-radius:50%;
    background:var(--amber-400);
    box-shadow:0 0 8px 2px rgba(255,210,63,.8);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  h1{
    font-size:26px; font-weight:800; letter-spacing:-.2px; margin:0 0 6px; color:var(--white);
  }
  h1 .amber{ color:var(--amber-500); }
  .tagline{
    font-size:11.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--ink-mute); margin:0 0 26px;
  }

  .links{ display:grid; gap:10px; margin-bottom:26px; }
  .link-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px;
    background:var(--navy-800);
    border:1px solid var(--navy-border);
    border-left:3px solid var(--amber-500);
    text-decoration:none; color:var(--ink);
    clip-path:polygon(0 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px));
    transition:background .15s, border-color .15s;
  }
  .link-row:hover{ background:var(--navy-border); border-left-color:var(--amber-400); }
  .link-row .dot{
    width:7px; height:7px; border-radius:50%; background:var(--amber-500); flex-shrink:0;
  }
  .link-row .txt{ flex:1; text-align:left; }
  .link-row .label{
    display:block; font-size:10px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink-mute);
  }
  .link-row .value{ display:block; font-size:15px; font-weight:600; color:var(--white); margin-top:2px; }
  .link-row .arrow{ color:var(--amber-500); font-size:16px; flex-shrink:0; }

  .qr-block{
    display:inline-flex; flex-direction:column; align-items:center; gap:10px;
    padding-top:22px; border-top:1px solid var(--navy-border);
  }
  .qr-block img{
    width:126px; height:126px; padding:10px; background:var(--white);
    clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px));
  }
  .qr-block span{
    font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--ink-mute);
  }

  .footer-strip{
    padding:14px 20px; text-align:center;
    font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--navy-950); background:var(--amber-500);
  }
</style>
</head>
<body>

<div class="card">
  <div class="hazard"></div>
  <div class="panel">
    <div class="badge-ring">
      <span class="led" aria-hidden="true"></span>
      <img src="images/logo-icon.png" alt="Power Pro Electrical">
    </div>

    <h1>POWER PRO <span class="amber">ELECTRICAL</span></h1>
    <p class="tagline">HV / LV Electrical &amp; Industrial Specialists</p>

    <div class="links">
      <a class="link-row" href="https://wa.me/27832795157?text=Hi%20Power%20Pro%20Electrical%2C%20I%27d%20like%20a%20quote" target="_blank" rel="noopener">
        <span class="dot"></span>
        <span class="txt"><span class="label">WhatsApp</span><span class="value">083 279 5157</span></span>
        <span class="arrow">&#8594;</span>
      </a>
      <a class="link-row" href="tel:0832795157">
        <span class="dot"></span>
        <span class="txt"><span class="label">Call — 24/7 Emergency</span><span class="value">083 279 5157</span></span>
        <span class="arrow">&#8594;</span>
      </a>
      <a class="link-row" href="mailto:powerpro.co.za@gmail.com">
        <span class="dot"></span>
        <span class="txt"><span class="label">Email</span><span class="value">powerpro.co.za@gmail.com</span></span>
        <span class="arrow">&#8594;</span>
      </a>
      <a class="link-row" href="https://powerproservices.co.za" target="_blank" rel="noopener">
        <span class="dot"></span>
        <span class="txt"><span class="label">Website</span><span class="value">powerproservices.co.za</span></span>
        <span class="arrow">&#8594;</span>
      </a>
    </div>

    <div class="qr-block">
      <img src="images/card-wa-qr.png" alt="Scan to WhatsApp Power Pro Electrical">
      <span>Scan to WhatsApp</span>
    </div>
  </div>
  <div class="footer-strip">Nationwide &middot; 24/7 Emergency Call-Outs</div>
</div>

</body>
</html>
